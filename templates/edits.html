<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Order#{{ order_num }} | FOCS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edits.css') }}">
</head>
<body class="chronos-theme">

<div class="form-container">
    <div class="form-group">
    <header class="page-header">
        <h1>Update Order# {{ form_data.order_number }}</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="{{ url_for('cancel_order') }}" class="btn-secondary">↶ Cancel Order</a>

            <form action="{{ url_for('logout') }}" method="post" style="margin: 0;">
                <button type="submit" class="btn-logout-red">Logout</button>
            </form>
        </div>
    </header>
    </div>

        <!-- Error Message -->
    {% with messages = get_flashed_messages(category_filter=["order_error"]) %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert-error" style="color: #ff4d4d; background: #2a1b1b; padding: 10px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ff4d4d;">
              {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <main class="new-order">
        <form action="{{ url_for('edit_order', order_num=form_data.order_number) }}" method="POST">
            <!-- Use value attribute to keep data on reload -->
            <div class="form-group">
            <label>Order Number</label>
            <input type="text" name="order_number"
                   value="{{ form_data.order_number if form_data else '' }}" required
                   readonly
                   class="input-locked">
            </div>

            <div class="form-group">
            <input type="text" name="customer_name" placeholder="Customer Name"
                   value="{{ form_data.customer_name if form_data else '' }}" required>
            </div>

            <div class="form-group">
            <input type="text" name="address" placeholder="Address"
                   value="{{ form_data.address if form_data else '' }}" required>
            </div>

            <div class="form-group">
            <label for="arrival">Arrival Time</label>
            <input type="time" id="arrival" name="arrival_time"
                   value="{{ form_data.arrival_time if form_data else '' }}" required>
            </div>

            <div class="form-group">
            <label for="departure">Departure Time</label>
            <input type="time" id="departure" name="end_time"
                   value="{{ form_data.end_time if form_data else '' }}" required>
            </div>

            <div class="form-group">
            <label>Meter#</label>
            <input type="number" name="meter_number"
                   value="{{ form_data.meter_number if form_data else '' }}" required>
            </div>

            <div class="form-group">
            <label>ERT#</label>
            <input type="number" name="ert_number"
                   value="{{ form_data.ert_number if form_data else '' }}" required>
            </div>

            <div class="form-group">
            <label>Current Read</label>
            <input type="number" name="read"
                   value="{{ form_data.read if form_data else '' }}" required>
            </div>

            <div class="form-group">
            <label>Tech Notes</label>

            <textarea name="notes">{{ form_data.notes if form_data else '' }}</textarea>
            </div>
            <button type="submit" class="btn-primary">Update Order</button>
        </form>
    </main>
</div>

</body>
</html>
